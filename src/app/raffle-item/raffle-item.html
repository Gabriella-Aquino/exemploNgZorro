<li>
  <span class="item-name">{{ raffleItem() }}</span>
  <button
    class="remove-btn"
    ngmMotion
    [whileHover]="{ scale: 1.2, rotate: 90 }"
    [whileTap]="{ scale: 0.85 }"
    [transition]="{ type: 'spring', stiffness: 400, damping: 17 }"
    (click)="remove.emit()"
    aria-label="Remover item"
  >×</button>
</li>

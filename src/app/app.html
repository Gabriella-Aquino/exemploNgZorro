<main class="mainConainer">
  <div class="listContainer">
    <div class="listContent">
      @for (item of raffleItems(); track item) {
        <app-raffle-item [raffleItem]="item"></app-raffle-item>
      }
    </div>
    <app-input [(value)]="appValue" (submit)="addRaffleItem()"></app-input>
  </div>
</main>

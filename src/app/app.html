<main class="mainConainer">
  <div class="listContainer">
    <div class="listContent">
      @for (item of raffleItems(); track item.id) {
        <app-raffle-item
          ngmMotion
          [initial]="{ opacity: 0, y: 32 }"
          [animate]="{ opacity: 1, y: 0 }"
          [exit]="{ opacity: 0, x: -60, height: 0, marginBottom: 0 }"
          [transition]="{ type: 'spring', stiffness: 300, damping: 25 }"
          [raffleItem]="item.name"
          (remove)="removeRaffleItem(item.id)"
        ></app-raffle-item>
      }
    </div>
    <app-input [(value)]="appValue" (submit)="addRaffleItem()"></app-input>
  </div>

  <section class="rafflePanelContainer">
    <div class="rafflePanel">
      <p>{{ selectedRaffleItem() || 'O item sorteado aparecerá aqui' }}</p>
    </div>

    <button
      ngmMotion
      [whileTap]="{ scale: 0.5 }"
      [whileHover]="{ scale: 1.1 }"
      [transition]="{ type: 'spring', stiffness: 400 }"
      nz-button
      nzType="primary"
      class="raffleButton"
      [disabled]="!raffleItems().length"
      (click)="drawRaffleItem()"
    >
      Sortear
    </button>
  </section>
</main>
